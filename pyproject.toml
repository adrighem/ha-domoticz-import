[project]
name = "ha-domoticz-sync"
version = "0.3.0"
description = "Home Assistant custom integration that imports device state from Domoticz"
readme = "README.md"
requires-python = ">=3.14.2"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "Vincent van Adrighem", email = "vincent@vanadrighem.eu" }
]
dependencies = [
  "aiohttp>=3.9",
  "voluptuous>=0.14"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation"
]

[project.urls]
Homepage = "https://github.com/adrighem/ha-domoticz-sync"
Issues = "https://github.com/adrighem/ha-domoticz-sync/issues"
Repository = "https://github.com/adrighem/ha-domoticz-sync"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=1.3.0"
]
home-assistant-test = [
  "pytest-homeassistant-custom-component==0.13.348"
]
lint = [
  "ruff>=0.8"
]
security = [
  "pip-audit>=2.7"
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components*"]
namespaces = true

[tool.setuptools.package-data]
"custom_components.domoticz_sync" = [
  "*.json",
  "brand/*.png",
  "translations/*.json",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.per-file-target-version]
"custom_components/domoticz_sync/core/*.py" = "py39"
"plugin.py" = "py39"
"tests/test_domoticz_plugin.py" = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# The vendorable neutral core supports Domoticz runtimes on Python 3.9.
"custom_components/domoticz_sync/core/*.py" = [
  "UP006",
  "UP007",
  "UP035",
  "UP042",
  "UP045",
]
